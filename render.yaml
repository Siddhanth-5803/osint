# One-click hosting on Render (free plan). See README "Share it with friends".
# Render asks for the values marked sync: false when you click the Deploy button.
services:
  - type: web
    name: fbi-open-up
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: ACCESS_MODE
        value: promo_only
      - key: PRICE_INR
        value: "5"
      - key: FREE_DAILY_LIMIT
        value: "5"
      - key: PROMO_CODES
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
